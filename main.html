<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks</title>
  <link href="src/main.css" rel="stylesheet">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <div class="toolbar">
      <label for="search">Search: <input id="search" type="search" autocomplete="off" disabled></label>
    </div>
    <p id="error-message" role="alert" hidden></p>
    <p id="sort-help" class="visually-hidden">Activate a column button to sort. Hold Shift while activating to sort by multiple columns. Sort priorities appear beside the arrows.</p>
    <table id="collection" aria-describedby="sort-help result-count">
      <caption class="visually-hidden">Bookmarks</caption>
      <colgroup>
        <col class="title-column"><col class="url-column"><col class="path-column">
        <col class="date-column"><col class="relative-column">
      </colgroup>
      <thead>
        <tr>
          <th scope="col"><button type="button" data-column="title" data-label="Title" disabled>Title <span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col"><button type="button" data-column="url" data-label="URL" disabled>URL <span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col"><button type="button" data-column="path" data-label="Path" disabled>Path <span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col"><button type="button" data-column="dateAdded" data-label="Date Added" disabled>Date Added <span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col">Relative</th>
        </tr>
      </thead>
      <tbody id="bookmark-rows"><tr id="empty-row"><td colspan="5">Loading bookmarks…</td></tr></tbody>
    </table>
    <p id="result-count" class="toolbar" role="status" aria-live="polite">Loading bookmarks…</p>
  </main>
</body>
</html>
